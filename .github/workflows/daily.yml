# 每天：检查所有仓库 → 生成网站数据 → 部署到 GitHub Pages。
# 检查结果提交回仓库，git 历史就是每天的检查记录。
name: daily

on:
  schedule:
    - cron: "17 2 * * *"  # 每天 UTC 02:17
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  VENUES: "iclr2025 cvpr2025 aaai2025"  # 空格分隔，对应 pipeline/config.toml 里的 [venues.*]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check repositories and build
        working-directory: pipeline
        run: |
          for v in $VENUES; do
            python -m scs probe  --venue "$v"
            python -m scs build  --venue "$v"
          done
          python -m scs render
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          git diff --cached --quiet || git commit -m "data: daily check $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
