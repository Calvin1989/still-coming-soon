# 每天：检查所有仓库 → 生成网站数据 → 部署到 GitHub Pages。
# 检查结果提交回仓库，git 历史就是每天的检查记录。
name: daily

on:
  schedule:
    # GitHub 的定时任务负载高时会延迟甚至跳过某一次（不报错），所以一天两次：
    # 早上那次被跳过时晚上补上；两次都跑也只是多检查一遍。
    - cron: "17 2 * * *"   # UTC 02:17，北京时间 10:17
    - cron: "17 14 * * *"  # UTC 14:17，北京时间 22:17（备用）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Look for newly announced conferences
        working-directory: pipeline
        run: python -m scs schedule  # 读不到 ccfddl 时保留原来的记录，不影响后面的步骤
      - name: Check repositories and build
        working-directory: pipeline
        run: |
          # 只处理开幕满 wait_days 天、且已经抓过论文的会议（见 pipeline/config.toml）
          venues=$(python -m scs venues --when due --with-data)
          echo "venues: $venues"
          for v in $venues; do
            python -m scs links  --venue "$v"  # 不联网，几秒；规则改进后第二天自动生效
            python -m scs probe  --venue "$v"
            python -m scs build  --venue "$v"
          done
          python -m scs render
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/links data/snapshots data/schedule.json
          git diff --cached --quiet && exit 0
          git commit -m "data: daily check $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep $((i * 10)); done
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
