[schedule]
# 会议开幕多少天后才在网站上展示：给作者留出整理代码的时间，免得会议刚开就被标成"没兑现"。
wait_days = 90

[classify]
# 达到这个大小才算"已开源"，低于它但大于 0 算"只放了少量代码"
min_code_bytes = 5000
code_extensions = [
  ".py", ".ipynb", ".pyx", ".c", ".cc", ".cpp", ".cu", ".cuh", ".h", ".hpp",
  ".java", ".scala", ".kt", ".js", ".ts", ".jsx", ".tsx", ".jl", ".m", ".r",
  ".rs", ".go", ".swift", ".lua", ".sh",
]
# 没有代码、但数据/模型文件达到这个大小，算"只放了数据"（基准测试类论文常见）
min_data_bytes = 100000
data_extensions = [
  ".json", ".jsonl", ".csv", ".tsv", ".txt", ".parquet", ".arrow", ".npy", ".npz",
  ".pkl", ".pt", ".pth", ".ckpt", ".safetensors", ".bin", ".h5", ".hdf5",
  ".zip", ".gz", ".tar", ".7z",
]
# README 里出现这些短语，说明作者写了"即将开源"
promise_phrases = [
  'coming soon', 'will be (?:made )?(?:publicly )?(?:released|available|open[- ]?sourced|uploaded|updated)',
  'to be released', 'upon (?:acceptance|publication)', 'stay tuned', '\bTODO\b',
  'under construction', 'release (?:the |our )?code soon', '即将开源', '敬请期待',
]

[probe]
workers = 16
timeout_seconds = 90
# 只下载小于这个大小的文件内容；更大的文件只记"至少这么大"
blob_limit_bytes = 262144
readme_chars = 1500
# 文件数不超过这个值时保存完整文件列表（已开源的大仓库不需要）
max_listing_files = 40

[site]
# 项目的 GitHub 地址，用于"申请更正"链接（指向 issues）。还没建仓库时留空。
repo_url = "https://github.com/Calvin1989/still-coming-soon"
