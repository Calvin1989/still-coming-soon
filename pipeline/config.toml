# 所有阈值、白名单、会议设置都放在这里，代码里不写死。

# ---------- 2025 ----------

[venues.iclr2025]
name = "ICLR 2025"
# 会议开幕日期。承诺天数从"论文首次公开"和"会议开幕"中较晚的那天算起。
conference_date = "2025-04-24"
arxiv_query = '''co:"ICLR 2025" OR co:ICLR2025 OR co:"ICLR'25"'''
# arXiv 备注里必须出现会议名
# 能匹配 ICLR 2025 / ICLR2025 / ICLR'25 / ICLR-2025 / ICLR'2025 / (ICLR) 2025 / ICLR (2025) / ICLR* 2025
include = ['''ICLR[\s,'’()*@-]*(?:20)?25\b''']
# 出现这些词说明不是正式录用论文，排除（宁可漏收，不要错收）
exclude = [
  'under review', 'submitted to', 'submission to', 'in submission',
  'workshop', 'reject', 'withdr[ae]w', 'tiny ?paper', 'blog ?post',
]

